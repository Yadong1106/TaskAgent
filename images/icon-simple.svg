<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#grad1)"/>
  
  <!-- Connection lines -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.5">
    <line x1="64" y1="64" x2="64" y2="30"/>
    <line x1="64" y1="64" x2="94" y2="80"/>
    <line x1="64" y1="64" x2="34" y2="80"/>
    <line x1="64" y1="30" x2="94" y2="80"/>
    <line x1="94" y1="80" x2="34" y2="80"/>
    <line x1="34" y1="80" x2="64" y2="30"/>
  </g>
  
  <!-- Center node -->
  <circle cx="64" cy="64" r="18" fill="#ffffff"/>
  <text x="64" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#6366f1" text-anchor="middle">C</text>
  
  <!-- Outer nodes -->
  <circle cx="64" cy="30" r="10" fill="#ffffff"/>
  <circle cx="94" cy="80" r="10" fill="#ffffff"/>
  <circle cx="34" cy="80" r="10" fill="#ffffff"/>
</svg>